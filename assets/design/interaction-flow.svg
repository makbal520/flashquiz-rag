<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030">
<style>.t{font-family:Inter,Arial,sans-serif;fill:#000}.h{font-size:28px}.s{font-size:16px}.m{font-size:13px;fill:#858585}.k{font-size:12px}.b{fill:#fff;stroke:#000;stroke-width:1.4}.g{fill:#fff;stroke:#8e8e90;stroke-width:1.2}.l{stroke:#000;stroke-width:1.5;fill:none}.d{stroke:#8e8e90;stroke-width:1.1;fill:none}.pill{fill:#fff;stroke:#000;stroke-width:1.1}.black{fill:#000}.w{fill:#fff}.small{font-size:10px}.tiny{font-size:9px;fill:#858585}</style>
<rect width="1600" height="1030" fill="#fff"/>
<text x="60" y="62" class="t h">FlashQuiz RAG+ — Core Learning Experience</text><text x="60" y="89" class="t m">A trustworthy learning loop: learn, ask, inspect evidence, and improve.</text><text x="1540" y="62" class="t m" text-anchor="end">Desktop-first · monochrome atelier notebook</text>
<line x1="60" y1="120" x2="1540" y2="120" class="l"/><circle cx="64" cy="147" r="4" class="black"/><text x="76" y="151" class="t k">User action</text><circle cx="185" cy="147" r="4" class="b"/><text x="197" y="151" class="t k">System result</text><circle cx="333" cy="147" r="4" fill="#858585"/><text x="345" y="151" class="t k">Progressive disclosure</text>
<!-- stage 1 --> <rect x="60" y="185" width="270" height="510" rx="8" class="g"/><rect x="76" y="201" width="91" height="27" rx="13" class="pill"/><text x="89" y="219" class="t k">01 / START</text><text x="76" y="262" class="t s">Import study material</text><text x="76" y="285" class="t m">One session = one PDF.</text><rect x="89" y="314" width="212" height="335" rx="18" class="b"/><text x="104" y="342" class="t tiny">FlashQuiz RAG+</text><text x="286" y="342" class="t tiny" text-anchor="end">EN / 中文</text><rect x="107" y="433" width="176" height="93" rx="8" class="b"/><text x="121" y="466" class="t k">Drop PDF or choose a file</text><text x="121" y="487" class="t tiny">Lecture notes · papers · course material</text><rect x="107" y="548" width="176" height="33" rx="16" class="black"/><text x="195" y="570" class="t k w" text-anchor="middle">Choose PDF</text><text x="107" y="611" class="t tiny">Recent: Machine Learning.pdf</text>
<!-- stage 2 --> <rect x="365" y="185" width="270" height="510" rx="8" class="g"/><rect x="381" y="201" width="106" height="27" rx="13" class="pill"/><text x="394" y="219" class="t k">02 / PREPARE</text><text x="381" y="262" class="t s">Process and configure</text><text x="381" y="285" class="t m">Visible progress; process once.</text><rect x="394" y="314" width="212" height="335" rx="18" class="b"/><text x="408" y="342" class="t tiny">Machine Learning.pdf</text><text x="592" y="342" class="t tiny" text-anchor="end">Processing</text><rect x="408" y="362" width="184" height="5" rx="3" class="b"/><rect x="408" y="362" width="111" height="5" rx="3" class="black"/><text x="408" y="390" class="t tiny">Chunked → Embedding → Topics</text><rect x="408" y="417" width="184" height="103" rx="8" class="b"/><text x="421" y="442" class="t k">Select study topics</text><rect x="421" y="456" width="67" height="21" rx="10" class="pill"/><text x="428" y="470" class="t small">Supervised</text><rect x="493" y="456" width="62" height="21" rx="10" class="pill"/><text x="501" y="470" class="t small">Loss</text><rect x="421" y="483" width="72" height="21" rx="10" class="pill"/><text x="429" y="497" class="t small">Evaluation</text><text x="408" y="547" class="t tiny">5 cards / topic · text + voice</text><rect x="408" y="573" width="184" height="33" rx="16" class="black"/><text x="500" y="595" class="t k w" text-anchor="middle">Generate 10 cards</text>
<!-- stage 3 --> <rect x="670" y="185" width="270" height="510" rx="8" class="g"/><rect x="686" y="201" width="83" height="27" rx="13" class="pill"/><text x="699" y="219" class="t k">03 / STUDY</text><text x="686" y="262" class="t s">Recall before revealing</text><text x="686" y="285" class="t m">One prompt, one focused response.</text><rect x="699" y="314" width="212" height="335" rx="18" class="b"/><text x="713" y="342" class="t tiny">Study</text><text x="897" y="342" class="t tiny" text-anchor="end">03 / 10</text><rect x="713" y="362" width="184" height="5" rx="3" class="b"/><rect x="713" y="362" width="107" height="5" rx="3" class="black"/><rect x="713" y="393" width="184" height="112" rx="8" class="b"/><text x="727" y="425" class="t k">What is overfitting?</text><text x="727" y="446" class="t k">How does it affect train</text><text x="727" y="467" class="t k">and test performance?</text><rect x="713" y="522" width="184" height="33" rx="16" class="b"/><text x="805" y="544" class="t k" text-anchor="middle">Type answer · Voice</text><rect x="713" y="570" width="184" height="33" rx="16" class="black"/><text x="805" y="592" class="t k w" text-anchor="middle">Submit answer</text><text x="713" y="626" class="t tiny">Cards · Hint · Skip</text>
<!-- stage 4 --> <rect x="975" y="185" width="270" height="510" rx="8" class="g"/><rect x="991" y="201" width="91" height="27" rx="13" class="pill"/><text x="1004" y="219" class="t k">04 / VERIFY</text><text x="991" y="262" class="t s">Feedback with evidence</text><text x="991" y="285" class="t m">Trust details stay secondary.</text><rect x="1004" y="314" width="212" height="335" rx="18" class="b"/><text x="1018" y="342" class="t tiny">AI feedback</text><text x="1202" y="342" class="t tiny" text-anchor="end">Complete</text><text x="1018" y="386" class="t" style="font-size:30px">8 / 10</text><line x1="1018" y1="408" x2="1202" y2="408" class="d"/><text x="1018" y="432" class="t small">Accurate. Add that generalization</text><text x="1018" y="448" class="t small">to new data declines.</text><line x1="1018" y1="468" x2="1202" y2="468" class="d"/><text x="1018" y="490" class="t tiny">MODEL ANSWER</text><text x="1018" y="506" class="t small">Memorizes training samples;</text><text x="1018" y="522" class="t small">does not generalize well.</text><rect x="1018" y="543" width="184" height="31" rx="7" class="g"/><text x="1030" y="563" class="t small">⌄  View evidence · 3 sources</text><rect x="1018" y="592" width="184" height="33" rx="16" class="black"/><text x="1110" y="614" class="t k w" text-anchor="middle">Next card</text>
<!-- stage 5 --> <rect x="1280" y="185" width="270" height="510" rx="8" class="g"/><rect x="1296" y="201" width="102" height="27" rx="13" class="pill"/><text x="1309" y="219" class="t k">05 / EXPLORE</text><text x="1296" y="262" class="t s">Ask, inspect, improve</text><text x="1296" y="285" class="t m">A shared RAG path preserves trust.</text><rect x="1309" y="314" width="212" height="335" rx="18" class="b"/><text x="1323" y="342" class="t tiny">Study</text><text x="1382" y="342" class="t tiny">Ask</text><line x1="1378" y1="347" x2="1401" y2="347" class="l"/><text x="1432" y="342" class="t tiny">Insights</text><text x="1323" y="382" class="t tiny">YOU</text><text x="1323" y="400" class="t small">How can I prevent overfitting?</text><text x="1323" y="434" class="t tiny">FLASHQUIZ</text><text x="1323" y="452" class="t small">Use regularization, more data,</text><text x="1323" y="468" class="t small">or cross-validation…</text><rect x="1323" y="486" width="184" height="47" class="b"/><text x="1332" y="505" class="t small">! Low confidence: 0.61</text><text x="1332" y="521" class="t tiny">Check the source or rephrase.</text><rect x="1323" y="546" width="184" height="31" rx="7" class="g"/><text x="1332" y="566" class="t small">⌄  Evidence · P.18 · Rank 1</text><rect x="1323" y="593" width="184" height="31" rx="16" class="b"/><text x="1415" y="613" class="t small" text-anchor="middle">Continue asking →</text>
<!-- arrows --> <path d="M330 440h26m-10-8 10 8-10 8M635 440h26m-10-8 10 8-10 8M940 440h26m-10-8 10 8-10 8M1245 440h26m-10-8 10 8-10 8" class="l"/>
<!-- lower notes --> <line x1="60" y1="742" x2="1540" y2="742" class="d"/><text x="60" y="777" class="t s">Evidence panel, session loop, and evaluation layer</text><text x="60" y="803" class="t m">The main path stays quiet. Evidence and evaluation become visible only when the learner needs to verify or improve.</text>
<rect x="60" y="835" width="450" height="115" rx="8" class="g"/><text x="76" y="863" class="t k">EVIDENCE PANEL — EXPANDED STATE</text><text x="76" y="890" class="t m">Source excerpt · page jump · similarity (0–1) · top-k rank.</text><text x="76" y="912" class="t m">Keyboard-accessible; low confidence is text-led, never color-only.</text>
<rect x="545" y="835" width="450" height="115" rx="8" class="g"/><text x="561" y="863" class="t k">SESSION COMPLETION</text><text x="561" y="890" class="t m">Show mastery summary, average score, and a retry route for missed cards.</text><text x="561" y="912" class="t m">Retry returns directly to Study and creates an actionable learning loop.</text>
<rect x="1030" y="835" width="510" height="115" rx="8" class="g"/><text x="1046" y="863" class="t k">INSIGHTS — DEVELOPER / PORTFOLIO VIEW</text><text x="1046" y="890" class="t m">Compare retrieval relevance, answer similarity, and LLM score by question type.</text><text x="1046" y="912" class="t m">Track chunk size, top-k, embedding model, and judge-prompt version across runs.</text>
<text x="60" y="990" class="t tiny">Design rules: Paper / Ink / Graphite · Inter regular · hairline borders · no shadows · no gradients · progressive disclosure.</text>
</svg>
